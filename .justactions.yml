# .justactions.yml
# ---
# project settings for just-github-actions-n-workflows.
# this file configures deploy targets, module overrides, and other
# workflow settings. place it in the root of any repo that uses
# the toolkit's workflows.
#
# see lib/src/settings/index.ts for the full type definition.
# ---

# --- example configuration ---
# uncomment and customize for your project:
#
# deploy:
#   ssh_target_path: ~/my-app
#   compose_file: ./docker-compose.yml
#   targets:
#     production:
#       host: app.example.com
#       compose_profiles: "@scope/backend,@scope/frontend"
#       profiles: "prod"
#       timezone: Europe/Bratislava
#     staging:
#       host: staging.example.com
#       compose_profiles: "@scope/backend"
#       compose_file: ./docker-compose.staging.yml
#       profiles: "staging"
#       timezone: UTC
#     # driver dokploy: redeploy a Dokploy compose with the new image tags
#     # (deploy.yml); channel stable/canary: deploy-on-release.yml deploys
#     # every matching release here. "manual" (default) is dispatch only.
#     demo:
#       driver: dokploy
#       channel: canary
#       dokploy:
#         compose_id: abc123
#
#   # needed by dokploy targets and previews; the DOKPLOY_API_KEY secret holds the key
#   dokploy:
#     url: https://dokploy.example.com
#
#   # PR previews (preview.yml / preview-cleanup.yml)
#   previews:
#     dokploy:
#       environment_id: <dokploy environment for previews>
#       server_id: <dokploy server>                 # optional
#     host: "pr-{pr}.pr.example.com"                # {pr} = PR number
#     compose_file: .github/preview/docker-compose.yml
#     env:                                          # {pr}, {host}, {image_tag} filled in
#       PREVIEW_HOST: "{host}"
#     images:                                       # modules built for a preview
#       - "@scope/backend"
#       - "@scope/frontend"
#     seed:                                         # optional, first deploy only
#       ssh_host: test.example.com
#       command: "bash ~/previews/pr-{pr}/seed.sh {app_name}-postgres-1"
#       upload:                                     # repo path -> remote path
#         .github/preview/seed.sh: ~/previews/pr-{pr}/seed.sh
#     cleanup_command: "rm -rf ~/previews/pr-{pr}"  # optional, on seed.ssh_host
#
# modules:
#   overrides:
#     - name: "@scope/backend"
#       docker_compose_service: backend
#     - name: "@scope/frontend"
#       docker_compose_service: frontend
#
# git:
#   committer_name: "github-actions[bot]"
#   committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
#   co_author_email: "your-email@example.com"

