name: Deploy Compose Remote
description: >
  Generates a deployment script for docker compose on a remote server.
  Handles registry login, image prune, compose pull, compose up, and cleanup.
  A failed registry login only warns. A target path starting with `~/` is
  resolved against the remote $HOME.
  Outputs the script for use with the ssh-exec action.

inputs:
  target_path:
    description: "Remote path where compose files are located"
    required: true
  registry_username:
    description: "Container registry username (optional)"
    required: false
    default: ""
  registry_password:
    description: "Container registry password (optional)"
    required: false
    default: ""
  registry:
    description: "Container registry URL"
    required: false
    default: "ghcr.io"
  additional_registries:
    description: >
      Space-separated registries to also log in to with the same credentials
      (e.g. "docker.io" for private Docker Hub images). Empty = registry only.
    required: false
    default: ""

outputs:
  script:
    description: "Generated deployment script to pass to ssh-exec"
    value: ${{ steps.run.outputs.script }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: ${{ github.action_path }}/../..

    - name: Run deploy-compose-remote
      id: run
      shell: bash
      env:
        TARGET_PATH: ${{ inputs.target_path }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
        REGISTRY: ${{ inputs.registry }}
        ADDITIONAL_REGISTRIES: ${{ inputs.additional_registries }}
      run: bun run ${{ github.action_path }}/src/index.ts

