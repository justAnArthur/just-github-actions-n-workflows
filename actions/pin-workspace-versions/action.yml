name: Pin Workspace Versions
description: >
  Rewrites a package's `workspace:` protocol dependencies to the concrete
  versions of the sibling workspace packages, reading each sibling's current
  manifest version. Run this right before publishing so the published manifest
  references resolvable registry versions instead of relying on the lockfile's
  (possibly stale) workspace:* substitution.

inputs:
  dir:
    description: "Path to the package directory whose package.json should be rewritten"
    required: true

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: ${{ github.action_path }}/../..

    - name: Run pin-workspace-versions
      shell: bash
      env:
        PKG_DIR: ${{ inputs.dir }}
      run: bun run ${{ github.action_path }}/src/index.ts
