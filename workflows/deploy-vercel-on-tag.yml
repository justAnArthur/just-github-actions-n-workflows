# deploy-vercel-on-tag.yml
# ---
# triggers a vercel deployment via deploy hook when a version tag is
# pushed that has "vercel" in its deploy targets annotation.
#
# uses vercel deploy hooks (HTTP POST) — no CLI, no checkout needed.
# vercel handles the build remotely from the linked git branch.
#
# the tag annotation is written by the bump-version action and contains
# a JSON object with a `deployTargets` array. this workflow reads the
# annotation via resolve-tag-meta and skips if "vercel" is not present.
#
# setup: create a deploy hook in your vercel project settings
# (Settings → Git → Deploy Hooks) and store the URL as a secret.
#
# two modes:
#   single hook — no `vercel.targets` in .justactions.yml: POSTs
#     VERCEL_DEPLOY_HOOK_URL for every tag (stable and prerelease).
#   fan-out — `vercel.targets` in .justactions.yml: POSTs every target
#     whose `packages` include the tag's package and whose `channels`
#     include the tag's channel (`stable`, or the prerelease id such as
#     `beta`). each target names the secret holding its hook URL via
#     `hook_secret`. VERCEL_DEPLOY_HOOK_URL is ignored in this mode.
#
#   vercel:
#     targets:
#       client-a:
#         hook_secret: VERCEL_HOOK_CLIENT_A
#         channels: [beta, stable]
#         packages: ["@scope/www"]
#
# secret names are dynamic, so the deploy step receives the job's whole
# `secrets` context (toJSON(secrets)) and picks the named ones; values
# are masked in logs. that hands every repo secret to the toolkit's
# trigger-deploy-hook step — pin the `uses:` ref to a release tag or
# SHA if that matters to you.
#
# the job summary lists which hooks fired and which were skipped (and why).
#
# copy this file into your repo's `.github/workflows/` and adjust
# the `push.tags` pattern to match your package naming convention.
#
# can also be called as a reusable workflow:
#
#   jobs:
#     deploy:
#       uses: justAnArthur/just-github-actions-n-workflows/.github/workflows/deploy-vercel-on-tag.yml@main
#       with:
#         tag: ${{ github.ref_name }}
#       secrets:
#         VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
#       # fan-out mode: use `secrets: inherit` instead, so the per-target
#       # hook secrets named in .justactions.yml reach this workflow
#
# required secrets:
#   VERCEL_DEPLOY_HOOK_URL — vercel deploy hook URL (single hook mode)
#   <hook_secret> per vercel.targets entry — one hook URL per target (fan-out mode)
# ---

name: deploy-vercel-on-tag
run-name: "deploy-vercel — ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: [ "**@*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to deploy (e.g. "@scope/frontend@1.2.3")'
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'tag to deploy (e.g. "@scope/frontend@1.2.3")'
        type: string
        required: true
    secrets:
      VERCEL_DEPLOY_HOOK_URL:
        description: "vercel deploy hook URL (single hook mode; not needed with vercel.targets)"
        required: false

permissions:
  contents: read

jobs:
  resolve-meta:
    runs-on: ${{ fromJSON(vars.JUSTACTIONS_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      pkg_name: ${{ steps.meta.outputs.pkg_name }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      prerelease_channel: ${{ steps.meta.outputs.prerelease_channel }}
      has_annotation: ${{ steps.meta.outputs.has_annotation }}
      publish_vercel: ${{ steps.meta.outputs.publish_vercel }}
    steps:
      - name: Resolve tag metadata
        id: meta
        uses: justAnArthur/just-github-actions-n-workflows/actions/resolve-tag-meta@main
        with:
          tag: ${{ inputs.tag || github.ref_name }}

  deploy-vercel:
    needs: resolve-meta
    if: >-
      needs.resolve-meta.outputs.has_annotation != 'true' ||
      needs.resolve-meta.outputs.publish_vercel == 'true'
    runs-on: ${{ fromJSON(vars.JUSTACTIONS_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - name: Checkout .justactions.yml
        uses: actions/checkout@v4
        with:
          sparse-checkout: /.justactions.yml
          sparse-checkout-cone-mode: false

      - name: Trigger Vercel deploy hook(s)
        uses: justAnArthur/just-github-actions-n-workflows/actions/trigger-deploy-hook@main
        with:
          hook_url: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          tag: ${{ needs.resolve-meta.outputs.tag }}
          pkg_name: ${{ needs.resolve-meta.outputs.pkg_name }}
          prerelease_channel: ${{ needs.resolve-meta.outputs.prerelease_channel }}
          secrets: ${{ toJSON(secrets) }}
