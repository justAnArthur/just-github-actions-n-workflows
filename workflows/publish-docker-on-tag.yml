# publish-docker-on-tag.yml
# ---
# builds and publishes a docker image to ghcr, then creates a github
# release with auto-generated release notes when a version tag is pushed.
#
# automatically skips packages that don't have "docker" in their tag
# annotation's deploy targets. for legacy tags without annotations,
# falls back to the get-dockerfile-path action (exits if no Dockerfile).
#
# copy this file into your repo's `.github/workflows/` and adjust
# the `push.tags` pattern to match your package naming convention.
#
# can also be called as a reusable workflow:
#
#   jobs:
#     publish:
#       uses: justAnArthur/just-github-actions-n-workflows/.github/workflows/publish-docker-on-tag.yml@main
#       with:
#         tag: ${{ github.ref_name }}
#       secrets:
#         NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
#
# the Dockerfile can read the registry token as a BuildKit secret:
#   RUN --mount=type=secret,id=github_token cat /run/secrets/github_token
#
# per-package build args, BuildKit secrets, build network and a service
# container (e.g. a database a RUN step needs) come from
# `modules.overrides[].docker` in .justactions.yml — don't edit this file.
# called as a reusable workflow, pass `secrets: inherit` so the settings
# can reference any repo secret.
#
# the layer cache is the image's :buildcache tag on ghcr.io. jobs run on
# the JSON `runs-on` in the JUSTACTIONS_RUNS_ON repo variable (default
# "ubuntu-latest"). on persistent self-hosted runners, `docker.builder`
# in .justactions.yml keeps one buildx builder (and its local cache)
# between jobs instead of a new one per job.
#
# required secrets:
#   NPM_TOKEN — npm registry token (optional; pass it as a BuildKit secret via .justactions.yml)
#   GH_TOKEN  — optional PAT for private packages / cross-repo registry access;
#               used for the ghcr login and the github_token build secret
#               instead of GITHUB_TOKEN when set
# ---

name: publish-docker-on-tag
run-name: "publish-docker — ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: [ "**@*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (e.g. "@scope/pkg@1.2.3-canary.4")'
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'tag to build (e.g. "@scope/pkg@1.2.3-canary.4")'
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        description: "npm registry token (optional; referenced as a BuildKit secret from .justactions.yml docker.secrets)"
        required: false
      GH_TOKEN:
        description: "optional PAT for private packages / cross-repo registry access (falls back to GITHUB_TOKEN)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  resolve-meta:
    runs-on: ${{ fromJSON(vars.JUSTACTIONS_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      pkg_name: ${{ steps.meta.outputs.pkg_name }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      has_annotation: ${{ steps.meta.outputs.has_annotation }}
      publish_docker: ${{ steps.meta.outputs.publish_docker }}
      docker_build: ${{ steps.meta.outputs.docker_build }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}
          lfs: true

      - name: Fetch all tags
        uses: justAnArthur/just-github-actions-n-workflows/actions/fetch-tags@main

      - name: Resolve tag metadata
        id: meta
        uses: justAnArthur/just-github-actions-n-workflows/actions/resolve-tag-meta@main
        with:
          tag: ${{ inputs.tag || github.ref_name }}

  build-and-publish-docker:
    needs: resolve-meta
    if: >-
      needs.resolve-meta.outputs.has_annotation != 'true' ||
      needs.resolve-meta.outputs.publish_docker == 'true'
    runs-on: ${{ fromJSON(vars.JUSTACTIONS_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # one build per package at a time: on runners sharing a docker host, two
    # builds of a package would start its service on the same host port.
    # github keeps one waiting run per group, a newer one replaces it
    concurrency:
      group: publish-docker-${{ github.repository }}-${{ needs.resolve-meta.outputs.pkg_name || inputs.tag || github.ref_name }}
      cancel-in-progress: false

    # modules.overrides[].docker.service in .justactions.yml; not started when its image is empty
    services:
      build-service:
        image: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).service_image }}
        options: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).service_options }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-meta.outputs.tag || inputs.tag || github.ref_name }}
          lfs: true

      - name: Fetch all tags
        uses: justAnArthur/just-github-actions-n-workflows/actions/fetch-tags@main

      - name: Resolve dockerfile path
        id: dockerfile
        uses: justAnArthur/just-github-actions-n-workflows/actions/get-dockerfile-path@main
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag || inputs.tag || github.ref_name }}

      - name: Prepare image metadata
        id: prepare
        uses: justAnArthur/just-github-actions-n-workflows/actions/prepare-docker-meta@main
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag || inputs.tag || github.ref_name }}
          dockerfile: ${{ steps.dockerfile.outputs.dockerfile }}
          context: ${{ steps.dockerfile.outputs.context }}

      - name: Render package build settings
        id: build
        uses: justAnArthur/just-github-actions-n-workflows/actions/render-docker-build@main
        with:
          config: ${{ needs.resolve-meta.outputs.docker_build }}
          vars: ${{ toJSON(vars) }}
          secrets: ${{ toJSON(secrets) }}

      # with network: host the builder runs on the runner's network, so RUN steps reach the service on localhost
      - name: Set up docker buildx
        if: ${{ !fromJSON(needs.resolve-meta.outputs.docker_build).builder }}
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).network == 'host' && 'network=host' || '' }}
          buildkitd-flags: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).network == 'host' && '--allow-insecure-entitlement network.host' || '' }}

      # docker.builder.persistent in .justactions.yml: a named builder that outlives the job, so on a
      # persistent self-hosted runner BuildKit's local cache and RUN --mount=type=cache mounts stay.
      # created once per runner (docker host); a host-network build has a builder of its own
      - name: Set up persistent docker buildx builder
        if: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).builder }}
        shell: bash
        env:
          BUILDER: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).builder }}
          NETWORK: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).network }}
        run: |
          if ! docker buildx inspect "$BUILDER" --bootstrap > /dev/null 2>&1; then
            opts=()
            if [ "$NETWORK" = host ]; then
              opts=(--driver-opt network=host --buildkitd-flags "--allow-insecure-entitlement network.host")
            fi
            # another job on the same docker host may have created it meanwhile
            docker buildx create --name "$BUILDER" --driver docker-container "${opts[@]}" --bootstrap \
              || docker buildx inspect "$BUILDER" --bootstrap
          fi
          docker buildx inspect "$BUILDER"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push docker image to ghcr
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.prepare.outputs.context }}
          file: ${{ steps.prepare.outputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.prepare.outputs.repository }}/${{ steps.prepare.outputs.package_image_name }}:${{ steps.prepare.outputs.image_tag }}
          platforms: linux/amd64
          builder: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).builder }}
          network: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).network }}
          allow: ${{ fromJSON(needs.resolve-meta.outputs.docker_build).network == 'host' && 'network.host' || '' }}
          # the cache lives next to the image as its :buildcache tag; a failed cache export never fails the publish.
          # mode=max, or docker.builder.cache_to (min / off) with a persistent builder on a self-hosted runner
          cache-from: type=registry,ref=ghcr.io/${{ steps.prepare.outputs.repository }}/${{ steps.prepare.outputs.package_image_name }}:buildcache
          cache-to: ${{ steps.build.outputs.cache_to != 'off' && format('type=registry,ref=ghcr.io/{0}/{1}:buildcache,mode={2},image-manifest=true,oci-mediatypes=true,ignore-error=true', steps.prepare.outputs.repository, steps.prepare.outputs.package_image_name, steps.build.outputs.cache_to || 'max') || '' }}
          build-args: |
            USERNAME_GITHUB=${{ github.actor }}
            TAG_NAME=${{ steps.prepare.outputs.original_tag }}
            SANITIZED_IMAGE_TAG=${{ steps.prepare.outputs.image_tag }}
            ${{ steps.build.outputs.build_args }}
          secrets: |
            github_token=${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
            ${{ steps.build.outputs.secrets }}
          labels: |
            org.opencontainers.image.version=${{ steps.prepare.outputs.original_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Docker image for ${{ steps.prepare.outputs.package_raw }} built from tag ${{ steps.prepare.outputs.original_tag }}

      - name: Generate release notes
        id: generate_release_notes
        uses: justAnArthur/just-github-actions-n-workflows/actions/generate-release-notes@main
        with:
          tag_name: ${{ steps.prepare.outputs.original_tag }}
          root_dir: ${{ github.workspace }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.original_tag }}
          name: ${{ steps.prepare.outputs.original_tag }}
          prerelease: ${{ needs.resolve-meta.outputs.is_prerelease == 'true' }}
          body: |
            ## release notes

            ${{ steps.generate_release_notes.outputs.release_notes }}

            ## docker image

            published to [github container registry](https://github.com/${{ github.repository }}/pkgs/container/${{ steps.prepare.outputs.repo_name }}%2F${{ steps.prepare.outputs.package_image_name }}?tag=${{ steps.prepare.outputs.image_tag }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
